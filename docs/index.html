<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#047857">
  <meta name="description" content="A searchable, versioned registry of reusable skills from across the repository ecosystem.">
  <title>Skills Registry · 共享技能登錄庫</title>
  <style>
    :root{color-scheme:light;--ink:#102a24;--muted:#60736d;--green:#047857;--green-dark:#064e3b;--mint:#d1fae5;--surface:#ecfdf5;--line:#dbe8e2;--orange:#f97316;--paper:#f7faf8;--white:#fff;--shadow:0 14px 45px #0d33200d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit}.shell{width:min(1120px,calc(100% - 40px));margin:0 auto}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-size:16px;font-weight:800;letter-spacing:-.02em}.brand-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,#fff7ed,#ffedd5);border:1px solid #fed7aa;font-size:24px}.brand small{display:block;color:#6b8178;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.nav{display:flex;align-items:center;gap:10px}.nav-link,.lang button{border:1px solid var(--line);background:#fff;color:#315248;border-radius:999px;padding:8px 13px;text-decoration:none;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.nav-link:hover,.lang button:hover{border-color:#86c9aa;color:var(--green)}.lang{display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:white}.lang button{border:0;padding:6px 10px}.lang button[aria-pressed=true]{background:var(--green);color:white}
    .hero{position:relative;overflow:hidden;margin:16px 0 25px;padding:42px clamp(24px,6vw,70px);border:1px solid #c8ebd9;border-radius:25px;background:radial-gradient(ellipse at 94% 5%,#c6f6dc 0,transparent 33%),linear-gradient(120deg,#fff 4%,#f0fdf6 63%,#e4f9ed);box-shadow:var(--shadow)}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px #ffedd5}.hero h1{max-width:700px;margin:14px 0 10px;color:var(--green-dark);font-size:clamp(34px,6vw,58px);line-height:1.04;letter-spacing:-.055em}.hero p{max-width:610px;margin:0;color:#536d62;font-size:16px}.hero-bottom{display:flex;align-items:center;gap:10px;margin-top:25px;flex-wrap:wrap}.source-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid #b7e6ca;border-radius:999px;background:white;color:#076747;font-size:12px;font-weight:750;text-decoration:none}.source-pill.primary{background:var(--green);border-color:var(--green);color:white}.source-pill:hover{transform:translateY(-1px);box-shadow:0 5px 15px #0478571c}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:27px 2px 14px}.section-head h2{margin:0;color:#123a2c;font-size:19px;letter-spacing:-.03em}.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:7px 10px;border:1px solid #d6eae0;border-radius:10px;background:#fff;color:#587068;font-size:11px}.stat strong{color:var(--green);font:800 12px ui-monospace,monospace}.toolbar{display:flex;gap:10px;margin:15px 0 12px}.search-wrap{position:relative;flex:1}.search-wrap span{position:absolute;top:50%;left:14px;transform:translateY(-50%);font-size:19px;color:#6f8a7e}.search{width:100%;height:46px;padding:0 15px 0 42px;border:1px solid #cfe2d8;border-radius:13px;background:white;color:var(--ink);font:inherit;font-size:13px;outline:none}.search:focus{border-color:#36a875;box-shadow:0 0 0 3px #10b9811c}.filters{display:flex;gap:7px;overflow:auto;padding:3px 1px 12px;scrollbar-width:thin}.filter{white-space:nowrap;padding:7px 12px;border:1px solid #d6e2dc;border-radius:999px;background:#fff;color:#61746b;font-size:11px;font-weight:700;cursor:pointer}.filter:hover{border-color:#8ac9a8;color:var(--green)}.filter[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}.results-row{display:flex;justify-content:space-between;align-items:center;margin:3px 2px 10px;color:#718179;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{min-width:0;display:flex;flex-direction:column;min-height:185px;padding:17px;border:1px solid #e1eae5;border-radius:16px;background:#fff;box-shadow:0 5px 18px #153c2810;transition:transform .16s,border-color .16s,box-shadow .16s}.card:hover{transform:translateY(-2px);border-color:#a8dbc0;box-shadow:0 10px 26px #153c2815}.card-title{margin:0 0 10px;font:750 13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.card-title a{text-decoration:none}.card-title a:hover{color:var(--green)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tag{padding:3px 7px;border-radius:6px;background:#eff8f3;color:#37725a;font-size:10px;font-weight:750}.tag.version{background:#fff7ed;color:#b45309}.description{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 14px;color:#61746c;font-size:12px;line-height:1.6}.install-command{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 9px;border:1px solid #dcebe2;border-radius:9px;background:#f6fbf8}.install-command code{flex:1;min-width:0;overflow-wrap:anywhere;color:#174c37;font:11px ui-monospace,SFMono-Regular,Consolas,monospace}.copy-install{flex:none;border:0;border-radius:6px;padding:5px 8px;background:#e4f4ea;color:#176442;font:inherit;font-size:10px;font-weight:700;cursor:pointer}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid #edf2ef;color:#839189;font-size:10px}.card-foot a{color:var(--green);font-weight:750;text-decoration:none;white-space:nowrap}.empty,.loading,.error{grid-column:1/-1;padding:30px;border:1px dashed #bfd7c9;border-radius:14px;background:#fff;color:#66786f;text-align:center;font-size:13px}.error a{color:var(--green)}.footer{display:flex;justify-content:space-between;gap:12px;margin:35px 0 25px;padding-top:15px;border-top:1px solid #dfe9e3;color:#87958d;font-size:10px}.footer a{color:#4e7564;text-decoration:none}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.shell{width:min(100% - 24px,1120px)}.topbar{height:66px}.brand{font-size:14px}.brand-mark{width:37px;height:37px}.nav-link{display:none}.hero{padding:31px 22px;border-radius:20px}.hero p{font-size:14px}.section-head{align-items:start;flex-direction:column}.toolbar{margin-top:10px}.grid{grid-template-columns:1fr}.card{min-height:0}.footer{flex-direction:column}}
  </style>

</head>
<body>
  <header class="shell topbar"><a class="brand" href="./" aria-label="Skills Registry home"><span class="brand-mark" aria-hidden="true">🐇</span><span>Skills Registry<small>Shared knowledge · Versioned skills</small></span></a><nav class="nav" aria-label="Primary navigation"><div class="lang" role="group" aria-label="Language / 語言"><button type="button" data-lang="zh-TW" aria-pressed="true">繁中</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div><a class="nav-link" href="https://github.com/wenchiehlee/skills/blob/main/skills-index.yaml" target="_blank" rel="noopener">YAML ↗</a><a class="nav-link" href="https://github.com/wenchiehlee/skills" target="_blank" rel="noopener">GitHub ↗</a></nav></header>
  <main class="shell"><section class="hero"><span class="eyebrow" data-zh="跨專案技能目錄" data-en="Cross-repository skill catalog">跨專案技能目錄</span><h1 data-zh="好用的技能，<br>找到就能重用。" data-en="Useful skills,<br>ready to reuse.">好用的技能，<br>找到就能重用。</h1><p data-zh="集中探索多個專案共享、持續維護並有版本紀錄的技能。搜尋用途、瀏覽分類，或查看每項技能的來源與部署資訊。" data-en="Explore reusable skills shared across projects, maintained over time, and tracked by version. Search by purpose, browse categories, and inspect each skill’s source and deployments.">集中探索多個專案共享、持續維護並有版本紀錄的技能。搜尋用途、瀏覽分類，或查看每項技能的來源與部署資訊。</p><div class="hero-bottom"><a class="source-pill primary" href="https://github.com/wenchiehlee/skills" target="_blank" rel="noopener"><span data-zh="瀏覽技能原始碼" data-en="Browse skill sources">瀏覽技能原始碼</span> ↗</a><a class="source-pill" href="https://github.com/wenchiehlee/skills/blob/main/skills-index.yaml" target="_blank" rel="noopener"><span data-zh="查看機器可讀索引" data-en="Open machine-readable index">查看機器可讀索引</span> ↗</a></div></section>
    <section aria-labelledby="catalog-title"><div class="section-head"><div><h2 id="catalog-title" data-zh="技能與獨立工具目錄" data-en="Skills & standalone tools">技能與獨立工具目錄</h2><p data-zh="依名稱、用途、分類或來源搜尋" data-en="Search names, purposes, categories, or sources">依名稱、用途、分類或來源搜尋</p></div><div class="stats"><span class="stat"><strong id="stat-count">—</strong> <span data-zh="個項目" data-en="items">個項目</span></span><span class="stat"><strong id="stat-groups">—</strong> <span data-zh="個分類" data-en="categories">個分類</span></span><span class="stat"><span data-zh="索引更新" data-en="Index updated">索引更新</span> <strong id="stat-date">—</strong></span></div></div>
      <div class="toolbar"><label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" class="search" type="search" data-placeholder-zh="搜尋技能名稱、用途或關鍵字…" data-placeholder-en="Search skills by name, purpose, or keyword…" placeholder="搜尋技能名稱、用途或關鍵字…" autocomplete="off"></label></div><div id="filters" class="filters" aria-label="Skill categories"></div><div class="results-row"><span id="result-count" aria-live="polite"></span><span data-zh="點選技能名稱查看詳細內容" data-en="Select a skill to view its details">點選技能名稱查看詳細內容</span></div><div id="results" class="grid"><div class="loading" data-zh="正在載入技能目錄…" data-en="Loading the skill catalog…">正在載入技能目錄…</div></div>
    </section></main>
  <footer class="shell footer"><span>Skills Registry · <span data-zh="共享、版本化、可重用" data-en="Shared, versioned, reusable">共享、版本化、可重用</span></span><span><a href="https://github.com/wenchiehlee/skills" target="_blank" rel="noopener">GitHub</a> · <a href="https://github.com/wenchiehlee/skills/blob/main/README.md" target="_blank" rel="noopener">README</a></span></footer>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    (()=>{const savedLanguage=()=>{try{const saved=localStorage.getItem('skills-registry-language');return saved==='zh-TW'||saved==='en'?saved:null}catch{return null}};const browserLanguage=(navigator.languages&&navigator.languages[0])||navigator.language||'en';let skills=[],category='all',lang=savedLanguage()||(/^zh(?:-|$)/i.test(browserLanguage)?'zh-TW':'en');const $=s=>document.querySelector(s),t=(zh,en)=>lang==='zh-TW'?zh:en;const clean=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const categoryNames={Analytics:['分析','Analytics'],Company:['公司','Company'],Documents:['文件','Documents'],Finance:['財務','Finance'],Geospatial:['地理空間','Geospatial'],Hardware:['硬體','Hardware'],Legal:['法律','Legal'],Media:['媒體','Media'],Server:['伺服器','Server'],Social:['社群','Social'],'UX design':['使用者體驗設計','UX design']};const categoryOrder=['Analytics','Company','Documents','Finance','Geospatial','Hardware','Legal','Media','Server','Social','UX design'];const categoryRoot=value=>({analytics:'Analytics',company:'Company',document:'Documents',finance:'Finance',geo:'Geospatial',hardware:'Hardware',legal:'Legal',media:'Media',server:'Server',social:'Social',ux:'UX design'}[String(value||'').split('-')[0]]||value||'Other');const categoryLabel=value=>{const names=categoryNames[value];return names?t(names[0],names[1]):value};
      function setLanguage(next,persist=true){lang=next;document.documentElement.lang=next;if(persist){try{localStorage.setItem('skills-registry-language',next)}catch{}}document.querySelectorAll('[data-zh][data-en]').forEach(el=>el.innerHTML=el.dataset[next==='zh-TW'?'zh':'en']);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===next)));$('#search').placeholder=$('#search').dataset[next==='zh-TW'?'placeholderZh':'placeholderEn'];if(skills.length){renderFilters();render()}}
      function renderFilters(){const cats=categoryOrder.filter(root=>skills.some(s=>categoryRoot(s.category)===root));$('#filters').innerHTML=[['all',t('全部分類','All categories')],...cats.map(c=>[c,categoryLabel(c)])].map(([id,label])=>`<button class="filter" type="button" data-category="${clean(id)}" aria-pressed="${category===id}">${clean(label)}</button>`).join('');$('#filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.category;renderFilters();render()})}
      function render(){const q=$('#search').value.trim().toLocaleLowerCase();const visible=skills.filter(s=>(category==='all'||categoryRoot(s.category)===category)&&(!q||[s.name,s.description,s.group,s.category,categoryRoot(s.category),s.source,s.path,s.npm_package].some(v=>String(v||'').toLocaleLowerCase().includes(q))));$('#result-count').textContent=t(`顯示 ${visible.length} / ${skills.length} 項`,`Showing ${visible.length} of ${skills.length}`);if(!visible.length){$('#results').innerHTML=`<div class="empty">${t('找不到符合條件的項目，請試試其他關鍵字或分類。','No items match. Try another keyword or category.')}</div>`;return}$('#results').innerHTML=visible.map(s=>{const path=String(s.path||'');const isStandalone=s.item_type==='standalone-skill';const href=isStandalone?(s.npm_url||s.source):'https://github.com/wenchiehlee/skills/tree/main/'+path.split('/').map(encodeURIComponent).join('/');const install=s.install_command?`<div class="install-command"><code>${clean(s.install_command)}</code><button class="copy-install" type="button" data-command="${clean(s.install_command)}">${t('複製','Copy')}</button>${s.npm_url?`<a href="${clean(s.npm_url)}" target="_blank" rel="noopener">npm ↗</a>`:''}</div>`:'';const itemType=isStandalone?`<span class="tag">${t('獨立技能','Standalone skill')}</span>`:'';const foot=isStandalone?`<span>${clean(s.name)}</span><a href="${clean(s.source||s.npm_url)}" target="_blank" rel="noopener">${t('來源 repo','Source repo')} ↗</a>`:`<span>${clean(s.group||'')} · ${clean(s.repo_count??'—')} ${t('個 repo','repos')}</span><a href="${href}" target="_blank" rel="noopener">${t('技能詳情','Details')} →</a>`;return `<article class="card"><h3 class="card-title"><a href="${clean(href)}" target="_blank" rel="noopener">${clean(s.name)}</a></h3><div class="meta">${itemType}<span class="tag">${clean(categoryLabel(categoryRoot(s.category||s.group||'skill')))}</span><span class="tag version">v${clean(s.version||'—')}</span></div><p class="description">${clean(s.description||'')}</p>${install}<div class="card-foot">${foot}</div></article>`}).join('');$('#results').querySelectorAll('.copy-install').forEach(button=>button.onclick=async()=>{try{await navigator.clipboard.writeText(button.dataset.command);button.textContent=t('已複製','Copied');setTimeout(()=>button.textContent=t('複製','Copy'),1500)}catch{button.textContent=t('複製失敗','Copy failed')}})}
      document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));setLanguage(lang,false);$('#search').addEventListener('input',render);fetch('https://raw.githubusercontent.com/wenchiehlee/skills/main/skills-index.yaml',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.text()}).then(src=>{if(!window.jsyaml)throw Error('YAML parser unavailable');const data=jsyaml.load(src)||{};skills=Array.isArray(data.skills)?data.skills:[];const standaloneSkills=Array.isArray(data.standalone_skills)?data.standalone_skills:[];skills=skills.concat(standaloneSkills.map(s=>({...s,item_type:'standalone-skill',group:'standalone'})));$('#stat-count').textContent=skills.length.toLocaleString();$('#stat-groups').textContent=new Set(skills.map(s=>categoryRoot(s.category)).filter(Boolean)).size;$('#stat-date').textContent=data.generated_at||'—';renderFilters();render()}).catch(err=>{$('#results').innerHTML=`<div class="error">${t('技能索引目前無法載入。請改從 GitHub 查看最新索引。','The skill index could not be loaded. Open the latest index on GitHub.')}</div>`;$('#result-count').textContent='';console.error('Unable to load skills index',err)})
    })();
  </script>
