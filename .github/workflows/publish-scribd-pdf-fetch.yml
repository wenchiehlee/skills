name: Publish Scribd PDF Fetch skill to npm

on:
  push:
    tags:
      - 'skill-scribd-pdf-fetch-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing the package version to publish
        required: true
        default: main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Verify package version matches tag
        if: ${{ github.event_name == 'push' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: common/skill-scribd-pdf-fetch
        run: |
          EXPECTED_TAG="skill-scribd-pdf-fetch-v$(node -p "require('./package.json').version")"
          if [ "$EXPECTED_TAG" != "$RELEASE_TAG" ]; then
            echo "package.json version expects $EXPECTED_TAG, got $RELEASE_TAG"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        working-directory: common/skill-scribd-pdf-fetch
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
