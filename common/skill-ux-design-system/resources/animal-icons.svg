    <path d="M3.5 18H12a8 8 0 0 0 8-8V8a4 4 0 0 0-7.3-2.3L2 20" />
    <!-- Sharp Precision Beak -->
    <path d="m20 8 2.5.5-2.5.5" />
    <!-- Wing Contour -->
    <path d="M7 18a6 6 0 0 0 3.8-10.6" />
    <!-- Alert Perch Feet -->
    <path d="M10 18v3" />
    <path d="M14 18v3" />
  </symbol>

  <!-- 3. YoutubeAudio.Fetch: Fluid Wave Whale (Harmonic Resonance, Oceanic Cadence) -->
  <symbol id="icon-whale-sonic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Acoustic Water Spout (Blowhole Resonance) -->
    <path d="M18 9V5a2 2 0 0 0-4 0" />
    <path d="M18 5a2 2 0 0 1 4 0" />
