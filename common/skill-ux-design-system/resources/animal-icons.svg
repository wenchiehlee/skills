  <!-- 5. mkdocs-investment: Nordic Geometric Bear (Preservation & Risk Shield) -->
  <symbol id="icon-bear-defense" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Round Bear Ears -->
    <path d="m6 7 .5.5" />
    <path d="m18 7-.5.5" />
