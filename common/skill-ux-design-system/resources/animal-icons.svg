  <!-- 4. mkdocs-investment: Wall Street Geometric Bull (Alpha & Strength) -->
  <symbol id="icon-bull-fintech" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
