<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- ========================================================================
       UX-Deck Minimal Line Iconography (ask-bridge / Lucide Inspired)
       Grid: 24x24 · Stroke: 1.6px · Round Caps & Joins · Fill: None
       Pure Geometric Lines · High Recognition · Zero Visual Noise
       ======================================================================== -->

  <!-- 1. mkdocs-life: Scandinavian Line Deer (Graceful, Reflective, Clean) -->
  <symbol id="icon-deer-life" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antlers -->
    <path d="M3 3c0 2 1 3 4 3c2 0 3 1 3 3" />
    <path d="M21 3c0 2-1 3-4 3c-2 0-3 .3-3 3" />
    <path d="M7 3c0 1.3.3 2.3 1 3" />
    <path d="M17 3c0 1.3-.3 2.3-1 3" />
    <!-- Deer Head Contour -->
    <path d="M12 19c-1 0-4-3-4-6.5 0-2 1.3-3.5 4-3.5s4 1.5 4 3.5c0 3.5-3 6.5-4 6.5" />
    <!-- Ears -->
    <path d="M8 10.5l-2-1.5" />
    <path d="M16 10.5l2-1.5" />
    <!-- Eyes & Nose -->
    <path d="M10 13v.01" />
    <path d="M14 13v.01" />
    <path d="M12 16.5h.01" />
  </symbol>

  <!-- 2. GoogleAlertManager: Precision Radar Falcon (Swift Scout, Alert Bird) -->
  <symbol id="icon-falcon-radar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
