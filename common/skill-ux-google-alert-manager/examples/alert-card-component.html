<!-- Reusable GoogleAlertManager Alert Card Template -->
<div class="gam-card unread" data-id="alert-101">
  <div class="gam-card-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <!-- Falcon Radar Mascot Icon -->
      <svg class="ux-icon ux-icon-falcon" style="width: 18px; height: 18px;" aria-label="Radar Scout" title="遊隼雷達鎖定">
        <use href="#icon-falcon-radar"></use>
      </svg>
      <span class="gam-source-badge">Google News</span>
      <span class="gam-domain">technews.tw</span>
    </div>
    <span class="gam-time">20 分鐘前</span>
  </div>

  <h3 class="gam-card-title">
    <a href="https://example.com/article" target="_blank" rel="noopener">
      <strong>AI Agent</strong> 最新技術突破：邊緣端微型化模型推論速度提升 300%
    </a>
  </h3>

  <p class="gam-card-snippet">
    研究團隊發布最新輕量架構，有效降低嵌入式裝置的記憶體佔用率，並支援離線高精度多模態情境推理，在邊緣運算領域取得實質突破...
  </p>

  <div class="gam-card-actions">
    <button class="gam-action-btn starred" title="加星號">
      ★ 已收藏
    </button>
    <button class="gam-action-btn" title="標示為已讀">
      ✓ 已讀
    </button>
    <button class="gam-action-btn" title="延後提醒">
      ⏰ 稍後提醒
    </button>
    <button class="gam-action-btn" title="封存">
      📦 封存
    </button>
  </div>
</div>
