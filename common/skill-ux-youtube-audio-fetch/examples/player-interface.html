<!-- Floating Media Player Bar & Track Card Example -->
<div class="yt-grid">
  <!-- Track Card with Download Progress -->
  <div class="yt-card">
    <div class="yt-thumb-wrapper">
      <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop" alt="Thumbnail">
      <span class="yt-duration-badge">42:18</span>
    </div>
    <div class="yt-card-content">
      <h4 class="yt-card-title">Deep Focus Lo-Fi Coding Session - 2026 Special Edition</h4>
      <div class="yt-card-meta">ChillHop Radio • 1080p Stream</div>
      <div class="yt-progress-container" title="下載提取中: 78%">
        <div class="yt-progress-bar" style="width: 78%;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Floating Player Dock -->
<div class="yt-player-bar">
  <div class="yt-player-track">
    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&auto=format&fit=crop" alt="Now Playing">
    <div style="overflow: hidden;">
      <div style="font-weight: 600; font-size: 0.9rem; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;">Deep Focus Session</div>
      <div style="font-size: 0.75rem; color: var(--yt-text-muted);">ChillHop Radio</div>
    </div>
  </div>

  <div class="yt-player-controls">
    <div class="yt-control-buttons">
      <button style="background:none; border:none; color:var(--yt-text-muted); cursor:pointer;">⏮</button>
      <button class="yt-btn-play">▶</button>
      <button style="background:none; border:none; color:var(--yt-text-muted); cursor:pointer;">⏭</button>
    </div>
    <div class="yt-scrubber-row">
      <span class="yt-scrubber-time">14:20</span>
      <div class="yt-scrubber-track">
        <div class="yt-scrubber-fill" style="width: 34%;"></div>
      </div>
      <span class="yt-scrubber-time">42:18</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; width: 220px; justify-content: flex-end;">
    <!-- Soundwave Whale Mascot Indicator -->
    <div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(139, 92, 246, 0.15); padding: 4px 10px; border-radius: 999px;">
      <svg class="ux-icon ux-icon-whale" style="width: 16px; height: 16px;" aria-label="Sonic Whale">
        <use href="#icon-whale-sonic"></use>
      </svg>
      <span style="font-size: 0.8rem; font-weight: 600; color: var(--yt-accent);">320k Lossless</span>
    </div>
    <button style="background:none; border:none; color:var(--yt-text-muted); cursor:pointer;">🔊</button>
  </div>
</div>
