<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>Diagram Template</title>
<style>
  :root {
    --paper: #FAFAF8;
    --ink: #1A1A1A;
    --muted: #8A8A85;
    --accent: #5B4CFF;
    --link: #2F6FED;
    --border: rgba(0,0,0,0.12);
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
  }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    color: var(--ink);
  }
  #diagram-root {
    display: inline-block;
    padding: 24px;
  }
  .title {
    font-family: Georgia, "Noto Serif TC", serif;
    font-size: 20px;
    margin: 0 0 16px 0;
  }
  .node {
    fill: var(--paper);
    stroke: var(--border);
    stroke-width: 1px;
  }
  .node-accent {
    fill: var(--paper);
    stroke: var(--accent);
    stroke-width: 1px;
  }
  .label {
    font-size: 13px;
    fill: var(--ink);
  }
  .label-muted {
    font-size: 12px;
    fill: var(--muted);
  }
  .edge {
    stroke: var(--muted);
    stroke-width: 1px;
    fill: none;
  }
</style>
</head>
<body>
<!--
  這是最小可用 scaffold，不是完成品。
  依 references/diagram-types.md 選好類型、references/style-guide.md 對好 token 後，
  在 #diagram-root 內手刻 <svg>，座標一律取 4 的倍數，accent 只用在 1-2 個焦點元素上。
-->
<div id="diagram-root">
  <h1 class="title">Diagram Title</h1>
  <svg width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">Diagram Title</title>
    <desc id="diagram-desc">Diagram description for accessibility.</desc>

    <rect class="node" x="20" y="20" width="160" height="60" rx="6"/>
    <text class="label" x="100" y="54" text-anchor="middle">Node A</text>

    <rect class="node-accent" x="300" y="20" width="160" height="60" rx="6"/>
    <text class="label" x="380" y="54" text-anchor="middle">Node B (focus)</text>

    <path class="edge" d="M180 50 H300" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"/>
      </marker>
    </defs>
  </svg>
</div>
</body>
</html>
