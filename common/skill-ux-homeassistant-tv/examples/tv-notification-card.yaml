alias: "TV Popup: 客廳守護者與智能門鈴偵測"
description: "在 Android 電視右上角顯示 60% 半透明 Cyber Dark Slate HUD 通知 (position: 0, #660f172a)"
trigger:
  - platform: state
    entity_id: binary_sensor.front_door_motion
    to: "on"
action:
  - service: rest_command.pipup_tv_notify
    data:
      tv_ip: "192.168.31.232"
      duration: 10
      title: "玄關動態偵測"
      title_color: "#38bdf8"
      message: "偵測到訪客接近玄關門口，已啟動即時安防監控錄影。"
      media: >-
        {"image": {"uri": "https://img.icons8.com/fluency/96/doorbell.png", "width": 120}}

