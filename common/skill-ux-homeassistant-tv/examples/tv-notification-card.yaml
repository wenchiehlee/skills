# Home Assistant Automation Example: Android TV 10-foot Glancable Toast (PiPup REST + Lovelace)
# Verified on Android TV (PiPup Port 7979)

# Standard REST Command Definition in Home Assistant (configuration.yaml)
# rest_command:
#   pipup_tv_notify:
#     url: "http://{{ tv_ip | default('192.168.31.232') }}:7979/notify"
#     method: POST
#     headers:
#       Content-Type: "application/json"
#     payload: >-
#       {
#         "duration": {{ duration | default(10) }},
#         "position": 0,
